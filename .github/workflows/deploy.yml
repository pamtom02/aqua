name: Deploy to Kubero

on:
  workflow_run:
    workflows: ["Build API images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubero-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      KUBERO_TOKEN: ${{ secrets.KUBERO_TOKEN }}
      KUBERO_PIPELINE: ${{ vars.KUBERO_PIPELINE || 'facu' }}
      KUBERO_APPS: ${{ vars.KUBERO_APPS || 'api' }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - name: Redeploy configured apps
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KUBERO_TOKEN" ]; then
            echo "::error::Configure the repository secret KUBERO_TOKEN before deployment."
            exit 1
          fi
          if [[ ! "$KUBERO_PIPELINE" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::Invalid pipeline name."
            exit 1
          fi
          for app in $KUBERO_APPS; do
            if [[ ! "$app" =~ ^[a-z0-9-]+$ ]]; then
              echo "::error::Invalid application name."
              exit 1
            fi
            code=$(curl --silent --show-error --connect-timeout 15 --max-time 60 \
              --output /dev/null --write-out "%{http_code}" \
              --header "Authorization: Bearer $KUBERO_TOKEN" \
              "https://kubero.inf.uct.cl/api/apps/$KUBERO_PIPELINE/production/$app/restart")
            if [ "$code" != "200" ]; then
              echo "::error::Kubero rejected restart of $app (HTTP $code)."
              exit 1
            fi
            echo "Restart accepted: $app"
          done
      - name: Verify API readiness
        if: env.API_BASE_URL != ''
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
              "${API_BASE_URL%/}/api/v1/health" -o /tmp/aqua-health.json; then
              cat /tmp/aqua-health.json
              exit 0
            fi
            sleep 5
          done
          echo "::error::The API did not become ready after deployment."
          exit 1
