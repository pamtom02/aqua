name: Build API images

on:
  push:
    branches: [main, "deploy/**"]
    paths:
      - "apps/**"
      - ".github/workflows/server-build.yml"
      - "compose.yaml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: aquabloom
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: aquabloom_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aquabloom -d aquabloom_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install pytest==9.2.0 httpx2==2.16.2
      - run: python -m pytest -q
        env:
          ENVIRONMENT: test
          TEST_DATABASE_URL: postgresql://aquabloom:integration-only-password@127.0.0.1:5432/aquabloom_test
          JWT_SECRET: integration-test-only-key-xxxxxxxxxxxxxxxxxxxxxxxx
      - run: python -m compileall -q app application domain infrastructure
      - name: Verify shared PostgreSQL adapter
        run: |
          cmp app/postgres.py ../scientific/app/postgres.py
          cmp app/storage.py ../scientific/app/storage.py

  build-images:
    needs: [test-api, test-processing]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, satellite, scientific]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        env:
          SERVICE: ${{ matrix.service }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-$SERVICE" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./apps/${{ matrix.service }}
          build-args: APP_REVISION=${{ github.sha }}
          load: true
          push: false
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Audit installed image dependencies
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          docker run --rm --entrypoint python "$IMAGE" -m pip list --format=freeze > installed-runtime.txt
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --disable-pip --no-deps --progress-spinner off -r installed-runtime.txt
      - name: Publish audited image
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

  test-processing:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [satellite, scientific]
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install pytest==9.2.0 httpx2==2.16.2
      - run: python -m pytest -q
      - run: python -m compileall -q app
